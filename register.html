<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join Now | StrikeZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎳</text></svg>">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontWeight: {
                        semibold: '500',
                        bold: '600',
                        extrabold: '800',
                        black: '900'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           CORE STYLES & VARIABLES (STRIKEZONE THEME)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* STRICT NO SCROLL LOCK FROM TEMPLATE */
        html, body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* === NEW NEON GLOW / BOWLING THEME === */
        :root {
            --bg-color: #0F172A; /* Base Slate Dark */
            --bg-secondary: #1E293B; /* Slightly lighter slate */
            
            /* Card design shifted to a sleek dark glassmorphism */
            --bg-card: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.15);
            
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;

            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus-bg: rgba(255, 255, 255, 0.1);
            --input-text: #FFFFFF;
            --input-icon: #94A3B8;

            --page-text: #F8FAFC;
            --toggle-bg: #334155;

            /* Brand colors pulled from index.html (Bowling Theme Rose) */
            --accent-color: #E11D48; 
            --accent-dark: #BE123C;  
            --btn-text: #FFFFFF;

            --radius: 24px;
            --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            --btn-shadow: 0 4px 20px 0 rgba(225, 29, 72, 0.4);
            --btn-shadow-hover: 0 8px 30px -4px rgba(225, 29, 72, 0.6);
            
            /* Specific brand highlight for accents */
            --highlight: #F43F5E;
        }

        /* LIGHT MODE ALTERNATE (If toggled) */
        body.light-mode {
            --bg-color: #F8FAFC;
            --bg-secondary: #FFFFFF;

            --bg-card: #FFFFFF;
            --card-border: #E2E8F0;
            
            --text-main: #020617;
            --text-muted: #64748B;

            --input-bg: #F1F5F9;
            --input-border: #CBD5E1;
            --input-focus-bg: #FFFFFF;
            --input-text: #0F172A;
            --input-icon: #94A3B8;

            --page-text: #0F172A;
            --toggle-bg: #E2E8F0;

            --accent-color: #E11D48; 
            --accent-dark: #BE123C;  
            --btn-text: #FFFFFF;
            --highlight: #E11D48;

            --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
            --btn-shadow: 0 4px 14px 0 rgba(225, 29, 72, 0.3);
            --btn-shadow-hover: 0 8px 24px -4px rgba(225, 29, 72, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* RTL SUPPORT */
        [dir="rtl"] { text-align: right; }
        [dir="rtl"] .ml-2 { margin-left: 0; margin-right: 0.5rem; }
        [dir="rtl"] .mr-3 { margin-left: 0.75rem; margin-right: 0; }
        [dir="rtl"] .input-icon { left: auto; right: 14px; }
        [dir="rtl"] .input-field { padding: 0 40px 0 14px !important; }
        [dir="rtl"] .btn-icon { margin-left: 0; margin-right: 6px; transform: rotate(180deg); }
        [dir="rtl"] .top-back-btn i { transform: scaleX(-1); }
        [dir="rtl"] .password-field { padding-right: 38px !important; padding-left: 36px !important; }
        [dir="rtl"] .password-toggle { right: auto; left: 10px; }

        /* =========================================
           TOP CONTROLS BAR
           ========================================= */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            z-index: 50;
            flex-shrink: 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .top-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            letter-spacing: 0.3px;
            backdrop-filter: blur(12px);
        }

        .top-back-btn:hover {
            color: var(--highlight);
            border-color: var(--highlight);
            transform: translateY(-1px);
        }

        .toggle {
            width: 40px;
            height: 22px;
            background: var(--toggle-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--text-muted);
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Logic inverted because default is now Dark Mode */
        body:not(.light-mode) .toggle::before {
            left: 19px;
            background: var(--accent-color);
        }

        .top-btn-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-main);
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(12px);
        }

        .top-btn-text:hover {
            border-color: var(--highlight);
            color: var(--highlight);
        }

        /* =========================================
           CARD WRAPPER & UNIQUE DESIGN (NEON THEME)
           ========================================= */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 1.5rem 1rem;
            z-index: 10;
            position: relative;
        }

        .card-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Unique element replacing the frame: A glowing neon orbital ring */
        .card-neon-glow {
            position: absolute;
            inset: -4px;
            border-radius: calc(var(--radius) + 4px);
            background: linear-gradient(45deg, var(--accent-color), transparent, #6366f1, transparent, var(--accent-color));
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.8;
            filter: blur(8px);
            animation: moveGradient 4s linear infinite;
        }
        
        body.light-mode .card-neon-glow {
            opacity: 0.3;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .register-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.15rem 1.6rem;
            gap: 6px;
            transition: all 0.4s ease;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .auth-vip-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            align-self: center;
            padding: 4px 12px;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.1), rgba(225, 29, 72, 0.2));
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: var(--highlight);
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.35rem;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.2);
        }

        .auth-trust-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 0.85rem;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
        }
        .trust-item { display: inline-flex; align-items: center; gap: 5px; color: var(--text-main); }
        .trust-item i { color: var(--highlight); }
        .trust-dot { opacity: 0.4; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADERS - EXACT LOGO SIZING FROM TEMPLATE */
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 2px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2px;
        }

        .auth-header h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }

        /* COMPACT VERTICAL FORM - EXACT SIZES FROM TEMPLATE */
        form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-group label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            font-size: 0.78rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-field {
            width: 100%;
            height: 35px;
            padding: 0 10px 0 30px;
            border: 1.5px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 10px; /* Slightly softer for consumer app */
            font-size: 0.82rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0;
        }

        .input-field::placeholder {
            color: var(--input-icon);
            opacity: 0.9;
            font-weight: 500;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--highlight);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2); /* Rose glow */
        }

        .input-field:focus+.input-icon,
        .input-field:focus~.input-icon {
            color: var(--highlight);
        }

        .password-field { padding-right: 36px !important; }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 0.9rem;
            z-index: 5;
            transition: color 0.3s;
        }
        .password-toggle:hover { color: var(--highlight); }

        /* UTILITY ROW */
        .utility-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 4px 0 0 0;
            padding: 0;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .custom-checkbox input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark {
            height: 18px; width: 18px;
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 6px; /* Match input softer corners */
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .custom-checkbox input:checked~.checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .custom-checkbox input:checked~.checkmark::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--btn-text);
            font-size: 10px;
        }

        /* AUTH BUTTON (SOLID THEME COLOR) */
        .auth-btn {
            width: 100%;
            height: 35px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: var(--btn-text);
            border: none;
            border-radius: 10px; 
            font-size: 0.82rem;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--btn-shadow);
            margin-top: 2px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--btn-shadow-hover);
            filter: brightness(1.1);
        }

        .auth-btn:active { transform: translateY(0); }

        /* DIVIDER */
        .divider {
            text-align: center;
            position: relative;
            margin: 5px 0;
        }
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--input-border);
        }
        .divider span {
            position: relative;
            background: var(--bg-card);
            padding: 0 10px;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
            border-radius: 50px;
        }

        /* SOCIALS - MATCHING TEMPLATE STRUCTURE BUT DIFFERENT ICONS */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .social-btn {
            width: 100%;
            height: 33px;
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            user-select: none;
        }

        .social-btn .social-icon { display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
        .social-btn:hover { background-color: var(--input-focus-bg); border-color: var(--highlight); }

        .social-btn-google .social-icon { color: #4285F4; }
        .social-btn-apple .social-icon { color: var(--text-main); }
        .social-btn-facebook .social-icon { color: #1877F2; } /* Replaced MS with FB for Consumer Vibe */

        /* FOOTER LINKS */
        .login-link {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }
        .login-link a {
            color: var(--highlight);
            font-weight: 800;
            text-decoration: none;
            transition: all 0.2s;
        }
        .login-link a:hover { text-decoration: underline; }

        /* =========================================
           UNIQUE AMBIENT BACKGROUND (BOWLING ALLEY VIBE)
           ========================================= */
        .ambient-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image: url('https://images.unsplash.com/photo-1553531384-cc64ac80f931?auto=format&fit=crop&w=2400&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-color) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        body.light-mode .ambient-bg { opacity: 0.2; }
        body.light-mode .ambient-overlay { background: radial-gradient(circle at center, rgba(255,255,255,0.4) 0%, var(--bg-color) 100%); backdrop-filter: blur(20px); }

        /* RESPONSIVENESS */
        @media (max-width: 480px), (max-height: 640px) {
            html, body { height: auto !important; min-height: 100vh !important; overflow-y: auto !important; }
            .top-bar { padding: 1rem 1rem; position: relative; }
            .main-wrapper { padding: 0.5rem 1rem 1.5rem 1rem; height: auto; }
            .register-card { max-width: 100%; padding: 1.15rem 1.15rem; border-radius: 20px; }
            .auth-header p { display: none; }
            .auth-trust-footer { flex-direction: column; gap: 4px; border: none; padding: 4px; background: transparent; }
            .trust-dot { display: none; }
        }
    </style>
</head>

<body>
    
    <!-- UNIQUE AMBIENT BACKGROUND (Bowling/Arcade Neon Vibe) -->
    <div class="ambient-bg"></div>
    <div class="ambient-overlay"></div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <a href="index.html" class="top-back-btn" title="Back to Home">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Site</span>
        </a>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2" style="cursor: pointer;" onclick="document.getElementById('theme-toggle').click()">
                <i class="fas fa-sun text-xs" style="color: var(--text-main); transition: color 0.3s;"></i>
                <div class="toggle" id="theme-toggle"></div>
                <i class="fas fa-moon text-xs" style="color: var(--text-main); transition: color 0.3s;"></i>
            </div>
            <button id="rtl-toggle" class="top-btn-text">RTL</button>
        </div>
    </div>

    <!-- MAIN CENTERED CONTENT -->
    <div class="main-wrapper">
        <div class="card-wrapper">
            <div class="card-neon-glow"></div>

            <div class="register-card">

                <!-- VIP BADGE -->
                <div class="auth-vip-badge">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Free Registration</span>
                </div>

                <!-- 100% IDENTICAL LOGO SIZING & PLACEMENT -->
                <div class="auth-logo">
                    <a href="index.html" class="inline-flex items-center gap-2 text-lg md:text-xl font-bold tracking-wider whitespace-nowrap" style="color: var(--text-main) !important; text-decoration: none;">
                        <i class="fas fa-bowling-ball" style="color: var(--accent-color);"></i> StrikeZone
                    </a>
                </div>

                <div class="auth-header">
                    <h2>Join The Club</h2>
                    <p>Create an account to book lanes and earn rewards.</p>
                </div>

                <!-- FORM WITH EXACT TEMPLATE DOM STRUCTURE, NUMBER OF FIELDS, & SIZING -->
                <form id="register-form">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fname">First Name</label>
                            <div class="input-wrapper">
                                <input type="text" id="fname" class="input-field" placeholder="John" required>
                                <i class="fas fa-user input-icon"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lname">Last Name</label>
                            <div class="input-wrapper">
                                <input type="text" id="lname" class="input-field" placeholder="Doe" required>
                                <i class="fas fa-user input-icon"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" class="input-field" placeholder="bowler@example.com" required>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" class="input-field password-field" placeholder="••••••••" required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" id="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
                                <i class="fas fa-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- BUTTON & UTILITY PLACEMENT PRESERVED -->
                    <div class="utility-row">
                        <label class="custom-checkbox">
                            <input type="checkbox" required>
                            <div class="checkmark"></div>
                            <span class="ml-2 text-[0.7rem] font-semibold" style="color: var(--text-muted); line-height: 1.2;">
                                I agree to the <a href="#" style="color: var(--highlight); text-decoration: underline;">Terms</a> & <a href="#" style="color: var(--highlight); text-decoration: underline;">Privacy</a>
                            </span>
                        </label>
                    </div>

                    <button type="submit" class="auth-btn">Create Account <i class="fas fa-user-plus ml-2 text-xs"></i></button>
                </form>

                <div class="divider"><span>Or sign up with</span></div>

                <!-- VISIBLE & WORDED SOCIAL REGISTRATION BUTTONS -->
                <div class="social-login">
                    <button class="social-btn social-btn-google" type="button" aria-label="Sign up with Google">
                        <i class="fab fa-google social-icon"></i>
                        <span>Sign up with Google</span>
                    </button>
                    <button class="social-btn social-btn-facebook" type="button" aria-label="Sign up with Facebook">
                        <i class="fab fa-facebook-f social-icon"></i>
                        <span>Sign up with Facebook</span>
                    </button>
                    <button class="social-btn social-btn-apple" type="button" aria-label="Sign up with Apple">
                        <i class="fab fa-apple social-icon" aria-hidden="true"></i>
                        <span>Sign up with Apple</span>
                    </button>
                </div>

                <div class="login-link">
                    Already a VIP member? <a href="login.html">Sign In Here</a>
                </div>

            </div>

            <!-- TRUST FOOTER -->
            <div class="auth-trust-footer">
                <div class="trust-item"><i class="fas fa-shield-alt"></i> Secure Registration</div>
                <span class="trust-dot">•</span>
                <div class="trust-item"><i class="fas fa-ticket-alt"></i> Earn Rewards</div>
            </div>

        </div>
    </div>

    <script>
        // --- THEME LOGIC (Defaulting to Dark Mode based on CSS Logic) ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme'); // Don't default here, let logic handle it

        // We want Dark Mode as default unless explicitly set to light
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }

        themeToggle.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        };

        // --- RTL LOGIC ---
        const rtlToggle = document.getElementById('rtl-toggle');
        const savedDir = localStorage.getItem('dir') || 'ltr';

        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            rtlToggle.innerText = "LTR";
        }

        rtlToggle.onclick = () => {
            const isRTL = document.documentElement.dir === 'rtl';
            document.documentElement.dir = isRTL ? 'ltr' : 'rtl';
            localStorage.setItem('dir', isRTL ? 'ltr' : 'rtl');
            rtlToggle.innerText = isRTL ? 'RTL' : 'LTR';
        };

        // --- PASSWORD TOGGLE LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- FORM SUBMISSION ---
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirecting to login upon successful registration
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
